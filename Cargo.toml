[package]
name = "strobengine"
version = "0.3.0"
edition = "2024"

[lib]
name = "_strobengine"
# "cdylib" is necessary to produce a shared library for Python to import from.
# "rlib" is needed for `cargo test` to build the test harness.
crate-type = ["cdylib", "rlib"]

[dependencies]
# "extension-module" tells pyo3 we want to build an extension module (skips linking against libpython.so)
# "abi3-py311" tells pyo3 (and maturin) to build using the stable ABI with
# minimum Python version 3.11
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"] }
reqwest = { version = "0.13.4" }
http = "1"
bytes = "1"
tokio = { version = "1.53.0", features = ["sync", "time", "rt", "rt-multi-thread", "macros", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
mimalloc = "0.1.52"
urlencoding = "2"
fastrand = "2.5"
indicatif = "0.18.6"
