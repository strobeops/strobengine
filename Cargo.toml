[package]
name = "strobengine"
version = "0.3.0"
edition = "2024"

[lib]
name = "_strobengine"
# "cdylib" is necessary to produce a shared library for Python to import from.
# "rlib" is needed for `cargo test` to build the test harness.
crate-type = ["cdylib", "rlib"]

[dependencies]
# "extension-module" tells pyo3 we want to build an extension module (skips linking against libpython.so)
# "abi3-py311" tells pyo3 (and maturin) to build using the stable ABI with
# minimum Python version 3.11
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "http2"] }
http = "1"
bytes = "1"
tokio = { version = "1.53.0", features = ["sync", "time", "rt", "rt-multi-thread", "macros", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
mimalloc = "0.1.52"
urlencoding = "2"
fastrand = "2.5"
indicatif = "0.18.6"
futures-util = "0.3.34"
tonic = { version = "0.14.6", features = ["tls-webpki-roots"] }
prost = "0.14.4"
prost-types = "0.14.4"
base64 = "0.22"
hex = "0.4"
prost-reflect = { version = "0.16.5", features = ["serde"] }
protox = "0.9.1"
serde_json = "1.0.151"
tonic-reflection = { version = "0.14.6", default-features = false }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
webpki-roots = "0.26"
