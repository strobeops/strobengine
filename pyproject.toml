[project]
name = "strobengine"
version = "0.5.0"
description = "A load testing framework with a Python UI and a bare-metal Rust engine core."
readme = "README.md"
license = "Apache-2.0"
license-files = [
  "LICENSE",
]
authors = [
    { name = "riccione", email = "28346232+riccione@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0.0",
    "typer>=0.27.0",
    "jinja2>=3.1",
]

[project.urls]
Homepage = "https://github.com/strobeops/strobengine"
Documentation = "https://github.com/strobeops/strobengine/blob/main/docs/table_of_contents.md"
Source = "https://github.com/strobeops/strobengine"
Changelog = "https://github.com/strobeops/strobengine/blob/main/CHANGELOG.md"

[project.scripts]
strobengine = "strobengine.cli:main"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "strobengine._strobengine"
python-packages = ["strobengine"]
python-source = "src"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.rs" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[dependency-groups]
dev = [
    "ruff>=0.15.22",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "aiohttp>=3.14.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: marks tests as end-to-end integration scenarios (requires mock server)",
]

[tool.ruff]
# Target Python 3.11 features
target-version = "py311"

# Match standard Black line length
line-length = 88

# Exclude common generated/temporary directories
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
# Selected rule sets:
# E/W   - pycodestyle (errors/warnings)
# F     - Pyflakes
# I     - isort (import sorting)
# UP    - pyupgrade (modernize Python syntax automatically)
# B     - flake8-bugbear (catches common bugs/design pitfalls)
# SIM   - flake8-simplify (suggests cleaner code patterns)
# RUF   - Ruff-specific rules
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

# Ignore rules that conflict with Ruff's automatic code formatter
ignore = [
    "E501", # Line length (handled by formatter)
]

[tool.ruff.lint.isort]
# Combine multiple imports from the same package onto one line
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# Relax assertions and magic numbers inside tests
"tests/**/*.py" = [
    "S101", # Allow `assert` statements
    "PLR2004", # Allow magic values in test comparisons
]

[tool.ruff.format]
# Use double quotes for strings (standard across Black/Ruff)
quote-style = "double"

# Format code blocks inside docstrings
docstring-code-format = true
